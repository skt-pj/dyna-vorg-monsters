name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Restore common signing key
        run: bash ci/restore-signing-key.sh

      - name: Run unit tests and build APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_CERT="E6:48:32:00:71:B8:AB:0D:E0:38:F7:67:90:06:4B:99:46:1B:67:D7:DB:E7:CE:75:06:D1:2A:5F:4F:A8:84:D8"
          EXPECTED_CERT_NORMALIZED="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          mkdir -p dist
          cp "$RELEASE_APK" "dist/dyna-vorg-monsters-${VERSION_NAME}-release.apk"
          cp "$DEBUG_APK" "dist/dyna-vorg-monsters-${VERSION_NAME}-debug.apk"
          sha256sum "dist/dyna-vorg-monsters-${VERSION_NAME}-release.apk" > "dist/dyna-vorg-monsters-${VERSION_NAME}-release.apk.sha256"
          "$APKSIGNER" verify --verbose --print-certs "dist/dyna-vorg-monsters-${VERSION_NAME}-release.apk" > dist/signing-certificate.txt
          ACTUAL_CERT="$(grep 'Signer #1 certificate SHA-256 digest:' dist/signing-certificate.txt | head -1 | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT_NORMALIZED" ]]; then
            echo "Unexpected signer certificate: $ACTUAL_CERT" >&2
            exit 1
          fi

          cat > dist/build-metadata.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          branch=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          versionName=${VERSION_NAME}
          versionCode=${VERSION_CODE}
          ci_run_id=${GITHUB_RUN_ID}
          ci_job=build
          unit_test=:app:testDebugUnitTest SUCCESS
          debug_build=:app:assembleDebug SUCCESS
          release_build=:app:assembleRelease SUCCESS
          signer_sha256=${EXPECTED_CERT}
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dyna-vorg-monsters-0.1.0-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
